name: macOS build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Test interaction state machine
        run: xcrun swift test --filter ClipDeckCoreTests

      - name: Build and package app
        run: bash scripts/build.sh --zip

      - name: Retain locally signed app archive
        uses: actions/upload-artifact@v4
        with:
          name: ClipDeck-macos-build
          path: dist/ClipDeck-macos-*.zip
          if-no-files-found: error
          retention-days: 14
